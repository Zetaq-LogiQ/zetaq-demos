<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Plant Lab</title><link rel="icon" href="data:,">
<style>
:root{--ink:#1c2630;--ink2:#56616c;--card:rgba(250,251,249,.94);--acc:#2f8a55;--gold:#e9a53a;--sh:0 2px 10px rgba(20,30,40,.22)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#dfe8e6;color:var(--ink);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#pills{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.tag{position:absolute;left:0;top:0;font:700 14px/1 system-ui,sans-serif;color:#1c2630;background:rgba(255,255,255,.9);border-radius:7px;padding:5px 7px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.2)}
/* the ONE thing to tap: a pulsing ring on it, a bouncing arrow and a big "Tap: ..." button pointing at it */
#gring{position:fixed;left:0;top:0;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;border:4px solid #ffb020;box-shadow:0 0 0 3px rgba(255,255,255,.85),0 0 22px 8px rgba(255,176,32,.75),inset 0 0 14px rgba(255,176,32,.6);pointer-events:none;z-index:8;display:none;animation:gring 1.1s ease-in-out infinite}
@keyframes gring{50%{transform:scale(1.16)}}
#garr{position:fixed;left:0;top:0;width:34px;height:34px;margin-left:-17px;pointer-events:none;z-index:8;display:none}
#garr svg{width:34px;height:34px;display:block;animation:bob .75s ease-in-out infinite;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
#garr.up svg{animation-name:bobup}
@keyframes bob{0%,100%{transform:translateY(-5px)}50%{transform:translateY(5px)}}
@keyframes bobup{0%,100%{transform:rotate(180deg) translateY(-5px)}50%{transform:rotate(180deg) translateY(5px)}}
#glab{position:fixed;left:0;top:0;z-index:8;display:none;border:0;border-radius:999px;background:#ffb020;color:#1c2630;font:800 16px/1.15 system-ui,sans-serif;padding:12px 18px;min-height:46px;max-width:calc(100% - 16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 0 0 3px #fff,0 4px 14px rgba(0,0,0,.35);cursor:pointer;animation:glab 1.1s ease-in-out infinite}
#glab.nt{pointer-events:none}
@keyframes glab{50%{box-shadow:0 0 0 3px #fff,0 0 0 9px rgba(255,176,32,.45),0 4px 14px rgba(0,0,0,.35)}}
#card{position:fixed;left:50%;top:max(8px,env(safe-area-inset-top));transform:translate(-50%,-140%);width:min(600px,calc(100% - 16px));background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:9px 14px 10px;z-index:9;transition:transform .35s}
#card.on{transform:translate(-50%,0)}
#card .mh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px;color:var(--ink2);font-weight:700}
#card .mh #mt{overflow-wrap:anywhere}#card .mh #ma{white-space:nowrap}
#say{font-size:17px;line-height:1.3;font-weight:700;margin:5px 0 6px;overflow-wrap:anywhere;transition:color .25s}
#say .sn{display:inline-block;background:#ffb020;color:#1c2630;border-radius:8px;padding:1px 8px;margin-right:6px;font-size:15px;font-weight:800;white-space:nowrap}
#say.res{color:#1d6b3e}#say.res .sn{background:var(--acc);color:#fff}
#say.busy{color:#56616c}
#last{font-size:14px;line-height:1.3;color:#1d6b3e;font-weight:700;margin:-2px 0 6px;overflow-wrap:anywhere}
#last:empty{display:none}
#dots{display:flex;gap:4px}#dots i{flex:1;height:4px;border-radius:2px;background:#d4dad8}#dots i.d{background:var(--acc)}#dots i.c{background:var(--gold)}
#bAct{margin-top:8px;border:0;border-radius:12px;background:var(--acc);color:#fff;font:800 16px system-ui,sans-serif;padding:10px 14px;min-height:48px;width:100%;cursor:pointer}
#bAct.hot{animation:btnpulse 1s ease-in-out infinite}
@keyframes btnpulse{50%{box-shadow:0 0 0 7px rgba(255,176,32,.7)}}
.rb{position:fixed;z-index:6;width:48px;height:48px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--sh);display:grid;place-items:center;padding:0;cursor:pointer}
.rb svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#bHint{width:auto;border-radius:999px;padding:0 16px 0 12px;display:flex;gap:6px;align-items:center;font:800 16px system-ui,sans-serif;color:var(--ink)}
#bMenu{left:10px;bottom:max(12px,env(safe-area-inset-bottom))}#bHint{right:10px;bottom:max(12px,env(safe-area-inset-bottom))}
#bMusic{right:10px;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 58px)}#bExit{left:10px;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 58px)}
#bMusic.off svg .w{display:none}#bMusic.off svg .x{display:inline}#bMusic svg .x{display:none}
/* short messages sit just under the instruction bar (never over the bench centre) */
#msgs{position:fixed;left:50%;top:var(--ctop,120px);transform:translateX(-50%);width:min(480px,calc(100% - 24px));display:flex;flex-direction:column;align-items:center;gap:6px;z-index:8;pointer-events:none}
#msgs>div{display:none;border-radius:12px;padding:8px 12px;font-size:14px;line-height:1.3;font-weight:700;text-align:center;box-shadow:var(--sh)}
#msgs>div.on{display:block;animation:msgin .25s ease-out}
@keyframes msgin{from{opacity:0;transform:translateY(-6px)}}
#chip{background:rgba(28,38,48,.86);color:#fff;font-size:15px;border-radius:999px}
#caution{background:#fff3d6;color:#7a4b00}#toast{background:rgba(28,38,48,.9);color:#fff}
#intro{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.94);width:min(420px,calc(100% - 32px));background:var(--card);border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.3);padding:16px 18px;z-index:10;pointer-events:none;opacity:0;transition:opacity .35s,transform .35s;text-align:center}
#intro.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#intro small{display:block;font-size:14px;font-weight:700;color:var(--ink2)}#intro h2{margin:2px 0 10px;font-size:20px}
#intro p{margin:0;font-size:16px;font-weight:700;line-height:1.35;color:#1c2630}#intro p b{display:block;color:var(--acc);font-size:14px;margin-bottom:2px}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,110%);width:min(560px,100%);background:var(--card);border-radius:18px 18px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.2);padding:14px 16px calc(14px + env(safe-area-inset-bottom));z-index:8;transition:transform .35s}
.sheet.on{transform:translate(-50%,0)}
.sheet h2{margin:0 0 4px;font-size:18px}.sheet p{margin:0 0 8px;font-size:15px;line-height:1.35;color:#2a333c}
.sheet p b{color:var(--acc)}#rA{color:var(--ink2)}
#rS{color:var(--gold);font-size:18px;letter-spacing:2px}
.eq{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;background:#eef4ee;border-radius:12px;padding:10px 8px;margin:4px 0 10px;font-weight:700;font-size:14px;text-align:center}
.eq .arr{display:flex;flex-direction:column;align-items:center;min-width:96px}.eq .arr small{font-size:14px;color:var(--acc);font-weight:700}
.eq .arr b{display:block;width:80px;height:2px;background:var(--ink);position:relative;margin:3px 0}.eq .arr b::after{content:"";position:absolute;right:-1px;top:-4px;border:5px solid transparent;border-left:8px solid var(--ink);border-right:0}
.go{border:0;border-radius:12px;background:var(--acc);color:#fff;font:700 15px system-ui,sans-serif;padding:11px 16px;min-height:44px;width:100%;cursor:pointer}
#mlist{display:grid;gap:6px;margin:6px 0 8px}#mlist button{display:flex;gap:10px;align-items:center;border:1px solid #dfe5e2;background:#fff;border-radius:12px;padding:8px 10px;min-height:48px;text-align:left;font:600 15px system-ui,sans-serif;color:var(--ink);cursor:pointer}
#mlist b{width:28px;height:28px;border-radius:50%;background:#e8eeeb;display:grid;place-items:center;font-size:14px;flex:none}#mlist button.ok b{background:var(--acc);color:#fff}
#mlist small{display:block;font-size:14px;color:var(--ink2);font-weight:600}
.ov{position:fixed;inset:0;z-index:10;display:none;place-items:center;background:radial-gradient(circle at 50% 40%,rgba(223,232,230,.55),rgba(30,42,48,.55))}
.ov.on{display:grid}.ov .box{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:20px;width:min(340px,calc(100% - 40px));text-align:center}
.ov h1{margin:0 0 4px;font-size:22px}.ov p{margin:0 0 14px;color:var(--ink2);font-size:14px}
#scope{position:fixed;inset:0;z-index:7;display:none;place-items:center;background:rgba(10,14,18,.9)}
#scope.on{display:grid}#scope canvas{border-radius:50%;box-shadow:0 0 0 6px #2b3036,0 10px 40px rgba(0,0,0,.6);touch-action:none}
#scope .scap{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 76px);transform:translateX(-50%);color:#dfe7ea;font:600 14px system-ui,sans-serif;text-align:center;width:calc(100% - 140px)}
</style></head><body>
<canvas id="c"></canvas>
<div id="pills"></div>
<div id="gring"></div><div id="garr"><svg viewBox="0 0 24 24"><path d="M12 22 3 11h5.5V2h7v9H21z" fill="#ffb020" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
<button id="glab" class="pill"></button>
<div id="card"><div class="mh"><span id="mt"></span><span id="ma"></span></div><div id="say"></div><div id="last"></div><div id="dots"></div><button id="bAct" style="display:none">Wait</button></div>
<div id="msgs"><div id="chip"></div><div id="caution"></div><div id="toast"></div></div>
<div id="intro"><small id="iN"></small><h2 id="iT"></h2><p><b>Let us find out</b><span id="iA"></span></p></div>
<div id="scope"><canvas></canvas><div class="scap"></div></div>
<button class="rb" id="bMenu" aria-label="Experiments"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
<button class="rb" id="bHint" aria-label="Help: what to do"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>Help</button>
<button class="rb" id="bMusic" aria-label="Music"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path class="w" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/><path class="x" d="M17 9l5 6M22 9l-5 6"/></svg></button>
<button class="rb" id="bExit" aria-label="Leave"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
<div class="sheet" id="result"><div style="display:flex;justify-content:space-between;align-items:center"><h2 id="rT"></h2><span id="rS"></span></div><p id="rA"></p><p id="rP"></p><div id="rEq"></div><button class="go" id="bNext">Next experiment</button></div>
<div class="sheet" id="menu"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Experiments</h2><button class="rb" id="bMclose" style="position:static;width:44px;height:44px;box-shadow:none" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div id="mlist"></div></div>
<div class="ov on" id="start"><div class="box"><h1>Plant Lab</h1><p>Life Processes in Plants: six experiments from the book, done on a real lab bench.</p><p id="load" style="margin:-6px 0 12px;font-size:14px">Loading the lab…</p><button class="go" id="bStart" disabled>Loading…</button></div></div>
<div class="ov" id="end"><div class="box"><h1 id="endT">See you in the lab again!</h1><p>Plant Lab</p><button class="go" id="bAgain">Back to the lab</button></div></div>
<noscript>This simulation needs JavaScript.</noscript>
<script src="zq-telemetry.js"></script><script src="zq-sim-round.js"></script>
<script>
// ONE STANDARD section 10: a standalone sim = a round game (contract 1.0). One task = one round = one experiment from the book.
var TASKS = [
  { id: 'starch_test', level: 1 }, { id: 'sun_chlorophyll', level: 2 }, { id: 'air_needed', level: 3 },
  { id: 'stomata', level: 2 }, { id: 'water_up', level: 2 }, { id: 'respire', level: 3 }
];
var S = ZQSim.start({ content: { board: 'CBSE', class: 7, subject: 'SCI', chapter_id: 'CB-C7-SCI-10', chapter: 'Life Processes in Plants',
                                content_id: 'CB-C7-SCI-10-GAME-PLANTLAB', content_version: '1.0' }, tasks: TASKS });
window.__S = S;
</script>
<script src="app.4ab496b218.js"></script>
</body></html>
