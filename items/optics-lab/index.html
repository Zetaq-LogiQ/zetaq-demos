<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Optics Lab</title>
<link rel="icon" href="data:,">
<meta name="description" content="ZetaQ Optics Lab: six real 3D optics experiments with a laser, mirror, glass slab, prisms and a lens. Every ray is computed with Snell's law.">
<style>
:root {
  --bg: #05070a; --ink: #eef2f6; --dim: #9aa6b4; --panel: rgba(12, 16, 22, 0.72); --line: rgba(255, 255, 255, 0.10);
  --accent: #ff4d3d; --accent2: #ffb340; --ok: #46d7ff;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .35s ease; }
#top { position: fixed; left: 0; right: 0; top: 0; padding: max(12px, env(safe-area-inset-top)) 16px 0; pointer-events: none;
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
  background: linear-gradient(to bottom, rgba(5,7,10,.75), rgba(5,7,10,0)); padding-bottom: 18px; }
#ttl { min-width: 0; }
#brand { font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
#brand b { color: var(--ink); font-weight: 650; }
#exname { font-size: 19px; font-weight: 650; margin-top: 3px; line-height: 1.2; }
#prog { font-size: 14px; color: var(--dim); margin-top: 3px; }
#mute { pointer-events: auto; width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--line); background: var(--panel);
  color: var(--ink); display: grid; place-items: center; cursor: pointer; flex: none; backdrop-filter: blur(6px); }
#mute svg { width: 22px; height: 22px; }
#bottom { position: fixed; left: 0; right: 0; bottom: 0; padding: 22px 16px max(14px, env(safe-area-inset-bottom));
  background: linear-gradient(to top, rgba(5,7,10,.92) 55%, rgba(5,7,10,0)); }
#cap { font-size: 16px; line-height: 1.4; max-width: 760px; margin: 0 auto 12px; min-height: 45px; text-align: center; text-wrap: balance; }
#cap.anim { animation: capin .45s ease both; }
@keyframes capin { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
#row { display: flex; gap: 10px; max-width: 520px; margin: 0 auto; }
button.nav { height: 52px; border-radius: 26px; font-size: 17px; font-weight: 650; cursor: pointer; border: 1px solid var(--line);
  color: var(--ink); background: var(--panel); font-family: inherit; }
#back { width: 96px; flex: none; }
#back:disabled { opacity: .35; cursor: default; }
#next { flex: 1; background: linear-gradient(180deg, #ff5a45, #e23b2a); border-color: rgba(255,120,100,.6);
  box-shadow: 0 0 24px rgba(255, 70, 50, .35); }
#next:active, #back:active:not(:disabled) { transform: scale(.98); }
#labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.lb { position: absolute; left: 0; top: 0; font-size: 14px; line-height: 1; padding: 5px 8px; border-radius: 8px; white-space: nowrap;
  background: rgba(8, 11, 15, .78); border: 1px solid currentColor; font-weight: 600; font-variant-numeric: tabular-nums;
  transform: translate(-50%, -50%); will-change: transform; }
.lb.small { padding: 4px 6px; }
@media (min-width: 900px) {
  #exname { font-size: 22px; }
  #cap { font-size: 18px; }
  .lb { font-size: 15px; }
}
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<div id="fade"></div>
<div id="top">
  <div id="ttl">
    <div id="brand"><b>ZetaQ</b> · Optics Lab</div>
    <div id="exname">Reflection</div>
    <div id="prog">Experiment 1 of 6 · Step 1 of 6</div>
  </div>
  <button id="mute" aria-label="Music on or off"></button>
</div>
<div id="bottom">
  <div id="cap"></div>
  <div id="row">
    <button id="back" class="nav" aria-label="Back">‹ Back</button>
    <button id="next" class="nav" aria-label="Next">Next ›</button>
  </div>
</div>
<script type="module" src="./js/app.js"></script>
</body>
</html>
